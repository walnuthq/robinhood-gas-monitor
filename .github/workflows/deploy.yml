name: Deploy dashboard to GitHub Pages

# The databases are committed, so a deploy is a pure build: no chain access,
# no collector run, nothing to rate-limit. Refresh the data with
# `pnpm gas:refresh` / `pnpm health:refresh` and commit `apps/web/data/gas.db` /
# `apps/web/data/health.db` to publish new numbers.

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it: a half-deployed Pages
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Matches "engines": { "node": ">=24" } in package.json. `node:sqlite`
          # is read at build time by the dashboard's Server Components.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fail early if a database is missing
        # Without one the build still succeeds, and the page ships an empty state.
        run: |
          for pair in gas.db:gas:refresh health.db:health:refresh; do
            db="apps/web/data/${pair%%:*}"
            if [ ! -f "$db" ]; then
              echo "$db is not committed — the build would have no data."
              echo "Run 'pnpm ${pair#*:}' locally and commit the result."
              exit 1
            fi
            echo "database: $db $(du -h "$db" | cut -f1)"
          done

      - run: pnpm typecheck
      - run: pnpm lint

      - name: Resolve the Pages base path
        id: base
        run: |
          # A user/org site (owner.github.io) is served from the root; every
          # other repo is served from /<repo> and needs the prefix.
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static export
        env:
          PAGES_BASE_PATH: ${{ steps.base.outputs.path }}
        run: pnpm build

      - name: Disable Jekyll
        # Without this, Pages' Jekyll step drops the `_next` directory and the
        # site loads with no CSS or JS.
        run: touch apps/web/out/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
